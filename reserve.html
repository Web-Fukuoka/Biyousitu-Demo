<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ご予約｜atelier kinari</title>
<meta name="description" content="atelier kinari のご予約方法。WEB予約・LINE予約は24時間受付、お電話は営業時間内に承ります。">
<meta property="og:type" content="website">
<meta property="og:title" content="ご予約｜atelier kinari">
<meta property="og:image" content="./assets/img/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Shippori+Mincho:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<link rel="stylesheet" href="./assets/css/style.css?v=20261012-motion2">
</head>
<body data-page="reserve">
<main id="main">

  <header class="page-hero">
    <div class="wrap page-hero__grid">
      <div>
        <p class="crumb"><a href="./index.html">Home</a> ／ Reserve</p>
        <h1><span class="mask"><span>Reserve</span></span></h1>
        <p>ご予約</p>
      </div>
      <div data-render="pageHero"></div>
    </div>
  </header>

  <section class="section" style="padding-top:56px">
    <div class="wrap">
      <div class="ways">
        <article class="way" data-reveal>
          <div data-render="photo" data-key="reservePhotos.web" data-ar="16/10" data-sizes="(min-width: 900px) 33vw, 100vw"></div>
          <span class="en">Web</span>
          <h2>WEB予約（24時間）</h2>
          <p>空き状況を見ながら、メニューと担当者を選んで予約できます。初回20%OFFはこちらから。</p>
          <a class="btn btn--fill" data-href="web" href="#reserve-web">WEBで予約する<span class="arrow"></span></a>
        </article>
        <article class="way" data-reveal style="--d:.1s">
          <div data-render="photo" data-key="reservePhotos.line" data-ar="16/10" data-sizes="(min-width: 900px) 33vw, 100vw"></div>
          <span class="en">LINE</span>
          <h2>LINE予約・相談</h2>
          <p>「この写真みたいにしたい」と画像を送って相談できます。返信は営業時間内に行います。</p>
          <a class="btn" data-href="line" href="#reserve-line">LINEで友だち追加<span class="arrow"></span></a>
        </article>
        <article class="way" data-reveal style="--d:.2s">
          <div data-render="photo" data-key="reservePhotos.tel" data-ar="16/10" data-sizes="(min-width: 900px) 33vw, 100vw"></div>
          <span class="en">Tel</span>
          <h2>お電話</h2>
          <p class="big" data-bind="tel"></p>
          <p data-bind="hoursShort"></p>
          <a class="btn" data-href="tel" href="#">電話をかける</a>
        </article>
      </div>
    </div>
  </section>

  <section class="section season">
    <div class="wrap faq-grid">
      <div class="sec-head" data-reveal>
        <p class="eyebrow">Flow</p>
        <h2 class="h2">ご来店の流れ</h2>
      </div>
      <ol class="flow flow--photo" data-reveal data-render="flow"></ol>
    </div>
  </section>

  <section class="section">
    <div class="wrap faq-grid">
      <div class="sec-head" data-reveal>
        <p class="eyebrow">Before You Book</p>
        <h2 class="h2">よくある質問</h2>
      </div>
      <div class="faq" data-render="faq"></div>
    </div>
  </section>

</main>
<script src="./assets/js/site-data.js"></script>
<script src="./assets/js/main.js?v=20261012-motion2"></script>
</body>
</html>
